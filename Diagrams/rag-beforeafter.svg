<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="1100" height="560" fill="#0B0F15"/><text x="550.0" y="44" font-size="26" text-anchor="middle" fill="#E6EDF3" font-weight="700">Before RAG vs After RAG</text><text x="550.0" y="72" font-size="15" text-anchor="middle" fill="#8592A3">Same servo-encoder question, with and without your documents</text><text x="550.0" y="120" font-size="13" text-anchor="middle" fill="#8592A3">Same question: "Servo position error is rising — which spare part, is it in stock, what is the risk?"</text><rect x="50" y="160" width="470" height="360" rx="14" fill="#170F12" stroke="#F87171" stroke-width="1.8"/><text x="285" y="200" font-size="20" text-anchor="middle" fill="#F87171" font-weight="700">BEFORE RAG</text><text x="285" y="224" font-size="12" text-anchor="middle" fill="#AAB4C0">Plain chatbot, no company documents</text><rect x="80" y="250" width="410" height="70" rx="10" fill="#11161E" stroke="#1F2937" stroke-width="1.2"/><text x="285" y="282" font-size="13" text-anchor="middle" fill="#E6EDF3">Operator asks about the servo error + part</text><text x="285" y="304" font-size="11" text-anchor="middle" fill="#AAB4C0">Model has never seen the IM-500 data</text><rect x="80" y="340" width="410" height="150" rx="10" fill="#11161E" stroke="#1F2937" stroke-width="1.2"/><text x="105" y="368" font-size="13" text-anchor="start" fill="#F87171" font-weight="700">Result</text><text x="105" y="392" font-size="12" text-anchor="start" fill="#E6EDF3">•  Generic or guessed answer</text><text x="105" y="414" font-size="12" text-anchor="start" fill="#E6EDF3">•  Doesn't know the part number or stock</text><text x="105" y="436" font-size="12" text-anchor="start" fill="#E6EDF3">•  May invent a lead time (hallucination)</text><text x="105" y="458" font-size="12" text-anchor="start" fill="#E6EDF3">•  No source, not safe to plan on</text><rect x="580" y="160" width="470" height="360" rx="14" fill="#0C1A14" stroke="#34D399" stroke-width="1.8"/><text x="815" y="200" font-size="20" text-anchor="middle" fill="#34D399" font-weight="700">AFTER RAG</text><text x="815" y="224" font-size="12" text-anchor="middle" fill="#AAB4C0">Grounded in your uploaded documents</text><rect x="610" y="250" width="410" height="70" rx="10" fill="#11161E" stroke="#1F2937" stroke-width="1.2"/><text x="815" y="282" font-size="13" text-anchor="middle" fill="#E6EDF3">Same question about the servo error</text><text x="815" y="304" font-size="11" text-anchor="middle" fill="#AAB4C0">Health Manual + Spare Parts + Addendum</text><rect x="610" y="340" width="410" height="150" rx="10" fill="#11161E" stroke="#1F2937" stroke-width="1.2"/><text x="635" y="368" font-size="13" text-anchor="start" fill="#34D399" font-weight="700">Result</text><text x="635" y="392" font-size="12" text-anchor="start" fill="#E6EDF3">•  Cause: servo encoder EN-77 degrading (~6 days)</text><text x="635" y="414" font-size="12" text-anchor="start" fill="#E6EDF3">•  Exact part EN-77 — 0 in stock, 21-day lead</text><text x="635" y="436" font-size="12" text-anchor="start" fill="#E6EDF3">•  Flags URGENT (lead time &gt; failure date)</text><text x="635" y="458" font-size="12" text-anchor="start" fill="#E6EDF3">•  Cited to the exact source — safe &amp; actionable</text><defs><marker id="cy" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#22D3EE"/></marker><marker id="gn" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#34D399"/></marker><marker id="am" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F59E0B"/></marker><marker id="pu" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#A78BFA"/></marker><marker id="tl" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2DD4BF"/></marker><marker id="rd" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F87171"/></marker><marker id="mu" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8592A3"/></marker></defs></svg>