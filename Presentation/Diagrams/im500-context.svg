<svg viewBox="0 0 1100 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="1100" height="470" fill="#ffffff"/><text x="550.0" y="44" font-size="26" text-anchor="middle" fill="#1f2d3d" font-weight="700">Meet the Machine — IM-500</text><text x="550.0" y="72" font-size="15" text-anchor="middle" fill="#6b7280">Sensors report its health; we predict failures before they happen</text><text x="150" y="105" font-size="12" text-anchor="middle" fill="#1f4e79" font-weight="700">SENSORS (health signals)</text><rect x="40" y="120" width="220" height="38" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="150" y="144" font-size="13" text-anchor="middle" fill="#1f2d3d">Vibration</text><rect x="40" y="172" width="220" height="38" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="150" y="196" font-size="13" text-anchor="middle" fill="#1f2d3d">Oil temperature</text><rect x="40" y="224" width="220" height="38" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="150" y="248" font-size="13" text-anchor="middle" fill="#1f2d3d">Motor current</text><rect x="40" y="276" width="220" height="38" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="150" y="300" font-size="13" text-anchor="middle" fill="#1f2d3d">Screw torque</text><rect x="40" y="328" width="220" height="38" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="150" y="352" font-size="13" text-anchor="middle" fill="#1f2d3d">Tie-bar strain</text><rect x="40" y="380" width="220" height="38" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="150" y="404" font-size="13" text-anchor="middle" fill="#1f2d3d">Servo position</text><rect x="390" y="180" width="300" height="150" rx="14" fill="#eef3fb" stroke="#1f2d3d" stroke-width="2.5"/><text x="540.0" y="232" font-size="30" text-anchor="middle" fill="#1f2d3d" font-weight="700">IM-500</text><text x="540.0" y="262" font-size="14" text-anchor="middle" fill="#1f2d3d">Injection-Molding Machine</text><text x="540.0" y="288" font-size="12" text-anchor="middle" fill="#6b7280">Bay-3 line — melts &amp; moulds plastic</text><line x1="262" y1="139" x2="384" y2="255.0" stroke="#9aa7b5" stroke-width="1.4" marker-end="url(#arg)"/><line x1="262" y1="191" x2="384" y2="255.0" stroke="#9aa7b5" stroke-width="1.4" marker-end="url(#arg)"/><line x1="262" y1="243" x2="384" y2="255.0" stroke="#9aa7b5" stroke-width="1.4" marker-end="url(#arg)"/><line x1="262" y1="295" x2="384" y2="255.0" stroke="#9aa7b5" stroke-width="1.4" marker-end="url(#arg)"/><line x1="262" y1="347" x2="384" y2="255.0" stroke="#9aa7b5" stroke-width="1.4" marker-end="url(#arg)"/><line x1="262" y1="399" x2="384" y2="255.0" stroke="#9aa7b5" stroke-width="1.4" marker-end="url(#arg)"/><text x="910" y="105" font-size="12" text-anchor="middle" fill="#1e6b1e" font-weight="700">WHAT WE DO WITH THEM</text><rect x="760" y="140" width="300" height="60" rx="10" fill="#f2f9f2" stroke="#1e6b1e" stroke-width="1.5"/><text x="910" y="166" font-size="14" text-anchor="middle" fill="#1f2d3d" font-weight="700">Predict the failure</text><text x="910" y="186" font-size="12" text-anchor="middle" fill="#6b7280">before it happens</text><rect x="760" y="220" width="300" height="60" rx="10" fill="#f2f9f2" stroke="#1e6b1e" stroke-width="1.5"/><text x="910" y="246" font-size="14" text-anchor="middle" fill="#1f2d3d" font-weight="700">Find the spare part</text><text x="910" y="266" font-size="12" text-anchor="middle" fill="#6b7280">check stock &amp; lead time</text><rect x="760" y="300" width="300" height="60" rx="10" fill="#f2f9f2" stroke="#1e6b1e" stroke-width="1.5"/><text x="910" y="326" font-size="14" text-anchor="middle" fill="#1f2d3d" font-weight="700">Schedule maintenance</text><text x="910" y="346" font-size="12" text-anchor="middle" fill="#6b7280">before the breakdown</text><line x1="696" y1="255.0" x2="754" y2="220" stroke="#1e6b1e" stroke-width="2.2" marker-end="url(#ar)"/><defs><marker 