<svg viewBox="0 0 1100 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="1100" height="470" fill="#0B0F15"/><text x="550.0" y="44" font-size="26" text-anchor="middle" fill="#E6EDF3" font-weight="700">Meet the Machine — IM-500</text><text x="550.0" y="72" font-size="15" text-anchor="middle" fill="#8592A3">Sensors report its health; we predict failures before they happen</text><text x="150" y="105" font-size="12" text-anchor="middle" fill="#22D3EE" font-weight="700">SENSORS (health signals)</text><rect x="40" y="120" width="220" height="38" rx="8" fill="#11161E" stroke="#22D3EE" stroke-width="1.4"/><text x="150" y="144" font-size="13" text-anchor="middle" fill="#E6EDF3">Vibration</text><rect x="40" y="172" width="220" height="38" rx="8" fill="#11161E" stroke="#22D3EE" stroke-width="1.4"/><text x="150" y="196" font-size="13" text-anchor="middle" fill="#E6EDF3">Oil temperature</text><rect x="40" y="224" width="220" height="38" rx="8" fill="#11161E" stroke="#22D3EE" stroke-width="1.4"/><text x="150" y="248" font-size="13" text-anchor="middle" fill="#E6EDF3">Motor current</text><rect x="40" y="276" width="220" height="38" rx="8" fill="#11161E" stroke="#22D3EE" stroke-width="1.4"/><text x="150" y="300" font-size="13" text-anchor="middle" fill="#E6EDF3">Screw torque</text><rect x="40" y="328" width="220" height="38" rx="8" fill="#11161E" stroke="#22D3EE" stroke-width="1.4"/><text x="150" y="352" font-size="13" text-anchor="middle" fill="#E6EDF3">Tie-bar strain</text><rect x="40" y="380" width="220" height="38" rx="8" fill="#11161E" stroke="#22D3EE" stroke-width="1.4"/><text x="150" y="404" font-size="13" text-anchor="middle" fill="#E6EDF3">Servo position</text><rect x="390" y="180" width="300" height="150" rx="14" fill="#0E141C" stroke="#22D3EE" stroke-width="2.4"/><text x="540.0" y="232" font-size="30" text-anchor="middle" fill="#E6EDF3" font-weight="700">IM-500</text><text x="540.0" y="262" font-size="14" text-anchor="middle" fill="#E6EDF3">Injection-Molding Machine</text><text x="540.0" y="288" font-size="12" text-anchor="middle" fill="#AAB4C0">Bay-3 line — melts &amp; moulds plastic</text><line x1="262" y1="139" x2="384" y2="255.0" stroke="#8592A3" stroke-width="1.3" marker-end="url(#mu)"/><line x1="262" y1="191" x2="384" y2="255.0" stroke="#8592A3" stroke-width="1.3" marker-end="url(#mu)"/><line x1="262" y1="243" x2="384" y2="255.0" stroke="#8592A3" stroke-width="1.3" marker-end="url(#mu)"/><line x1="262" y1="295" x2="384" y2="255.0" stroke="#8592A3" stroke-width="1.3" marker-end="url(#mu)"/><line x1="262" y1="347" x2="384" y2="255.0" stroke="#8592A3" stroke-width="1.3" marker-end="url(#mu)"/><line x1="262" y1="399" x2="384" y2="255.0" stroke="#8592A3" stroke-width="1.3" marker-end="url(#mu)"/><text x="910" y="105" font-size="12" text-anchor="middle" fill="#34D399" font-weight="700">WHAT WE DO WITH THEM</text><rect x="760" y="140" width="300" height="60" rx="10" fill="#11161E" stroke="#34D399" stroke-width="1.4"/><text x="910" y="166" font-size="14" text-anchor="middle" fill="#E6EDF3" font-weight="700">Predict the failure</text><text x="910" y="186" font-size="12" text-anchor="middle" fill="#AAB4C0">before it happens</text><rect x="760" y="220" width="300" height="60" rx="10" fill="#11161E" stroke="#34D399" stroke-width="1.4"/><text x="910" y="246" font-size="14" text-anchor="middle" fill="#E6EDF3" font-weight="700">Find the spare part</text><text x="910" y="266" font-size="12" text-anchor="middle" fill="#AAB4C0">check stock &amp; lead time</text><rect x="760" y="300" width="300" height="60" rx="10" fill="#11161E" stroke="#34D399" stroke-width="1.4"/><text x="910" y="326" font-size="14" text-anchor="middle" fill="#E6EDF3" font-weight="700">Schedule maintenance</text><text x="910" y="346" font-size="12" text-anchor="middle" fill="#AAB4C0">before the breakdown</text><line x1="696" y1="255.0" x2="754" y2="220" stroke="#34D399" stroke-width="2.2" marker-end="url(#gn)"/><defs><marker id="cy" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#22D3EE"/></marker><marker id="gn" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#34D399"/></marker><marker id="am" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F59E0B"/></marker><marker id="pu" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#A78BFA"/></marker><marker id="tl" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2DD4BF"/></marker><marker id="rd" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F87171"/></marker><marker id="mu" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8592A3"/></marker></defs></svg>