<svg viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="1100" height="420" fill="#ffffff"/><text x="550.0" y="44" font-size="26" text-anchor="middle" fill="#1f2d3d" font-weight="700">Agents as a Team — Sequential Handoff</text><text x="550.0" y="72" font-size="15" text-anchor="middle" fill="#6b7280">A -&gt; B -&gt; C: one question flows through all three</text><text x="550.0" y="110" font-size="14" text-anchor="middle" fill="#1f2d3d" font-weight="700">Input:  "Servo position error 140 counts"</text><rect x="70" y="150" width="250" height="110" rx="12" fill="#f2f9f2" stroke="#1e6b1e" stroke-width="2"/><text x="195.0" y="190" font-size="20" text-anchor="middle" fill="#1e6b1e" font-weight="700">Agent A</text><text x="195.0" y="222" font-size="14" text-anchor="middle" fill="#1f2d3d">Failure Prediction</text><rect x="420" y="150" width="250" height="110" rx="12" fill="#f1eefb" stroke="#5b4b9a" stroke-width="2"/><text x="545.0" y="190" font-size="20" text-anchor="middle" fill="#5b4b9a" font-weight="700">Agent B</text><text x="545.0" y="222" font-size="14" text-anchor="middle" fill="#1f2d3d">Spare Parts</text><rect x="770" y="150" width="250" height="110" rx="12" fill="#fff7e6" stroke="#d99a00" stroke-width="2"/><text x="895.0" y="190" font-size="20" text-anchor="middle" fill="#d99a00" font-weight="700">Agent C</text><text x="895.0" y="222" font-size="14" text-anchor="middle" fill="#1f2d3d">Maintenance</text><line x1="326" y1="205.0" x2="414" y2="205.0" stroke="#1e6b1e" stroke-width="2.2" marker-end="url(#ar)"/><text x="370.0" y="142" font-size="11" text-anchor="middle" fill="#6b7280">passes:  Encoder EN-77, ~6 days</text><line x1="676" y1="205.0" x2="764" y2="205.0" stroke="#1e6b1e" stroke-width="2.2" marker-end="url(#ar)"/><text x="720.0" y="142" font-size="11" text-anchor="middle" fill="#6b7280">passes:  EN-77 = 0 in stock, 21-day lead</text><rect x="745" y="290" width="300" height="60" rx="10" fill="#fff7e6" stroke="#d99a00" stroke-width="1.5"/><text x="895.0" y="315" font-size="13" text-anchor="middle" fill="#1f2d3d" font-weight="700">URGENT maintenance request</text><text x="895.0" y="336" font-size="12" text-anchor="middle" fill="#6b7280">schedule &lt; 6 days, escalate to Bay-3 lead</text><line x1="895.0" y1="264" x2="895.0" y2="288" stroke="#d99a00" stroke-width="2.2" marker-end="url(#aro)"/><text x="550.0" y="390" font-size="13" text-anchor="middle" fill="#6b7280">One question flows through all three — the final decision no single agent could make alone.</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1e6b1e"/></marker><marker id="arb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1f4e79"/></marker><marker id="aro" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d99a00"/></marker><marker id="arg" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9aa7b5"/></marker><marker id="arp" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b4b9a"/></marker></defs></svg>