<svg viewBox="0 0 1100 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="1100" height="470" fill="#0B0F15"/><text x="550.0" y="44" font-size="26" text-anchor="middle" fill="#E6EDF3" font-weight="700">AI vs GenAI vs AI Agent vs Agentic AI</text><text x="550.0" y="72" font-size="15" text-anchor="middle" fill="#8592A3">Explained on the one machine we use all day — the IM-500</text><rect x="45" y="105" width="500" height="150" rx="12" fill="#11161E" stroke="#22D3EE" stroke-width="1.8"/><text x="69" y="143" font-size="20" text-anchor="start" fill="#22D3EE" font-weight="700">AI</text><text x="69" y="177" font-size="14" text-anchor="start" fill="#E6EDF3">Rules &amp; patterns</text><rect x="67" y="197" width="456" height="40" rx="8" fill="#0E141C" stroke="#1F2937" stroke-width="1"/><text x="295.0" y="222" font-size="13" text-anchor="middle" fill="#AAB4C0">"Flag if vibration &gt; 4.5"</text><rect x="565" y="105" width="500" height="150" rx="12" fill="#11161E" stroke="#34D399" stroke-width="1.8"/><text x="589" y="143" font-size="20" text-anchor="start" fill="#34D399" font-weight="700">Generative AI</text><text x="589" y="177" font-size="14" text-anchor="start" fill="#E6EDF3">Creates language</text><rect x="587" y="197" width="456" height="40" rx="8" fill="#0E141C" stroke="#1F2937" stroke-width="1"/><text x="815.0" y="222" font-size="13" text-anchor="middle" fill="#AAB4C0">Writes a shift summary from notes</text><rect x="45" y="280" width="500" height="150" rx="12" fill="#11161E" stroke="#A78BFA" stroke-width="1.8"/><text x="69" y="318" font-size="20" text-anchor="start" fill="#A78BFA" font-weight="700">AI Agent</text><text x="69" y="352" font-size="14" text-anchor="start" fill="#E6EDF3">LLM + your data + a decision</text><rect x="67" y="372" width="456" height="40" rx="8" fill="#0E141C" stroke="#1F2937" stroke-width="1"/><text x="295.0" y="397" font-size="13" text-anchor="middle" fill="#AAB4C0">"Servo error -&gt; EN-77 failing, ~6d"  (Agent A)</text><rect x="565" y="280" width="500" height="150" rx="12" fill="#11161E" stroke="#F59E0B" stroke-width="1.8"/><text x="589" y="318" font-size="20" text-anchor="start" fill="#F59E0B" font-weight="700">Agentic AI</text><text x="589" y="352" font-size="14" text-anchor="start" fill="#E6EDF3">A team of agents coordinating</text><rect x="587" y="372" width="456" height="40" rx="8" fill="#0E141C" stroke="#1F2937" stroke-width="1"/><text x="815.0" y="397" font-size="13" text-anchor="middle" fill="#AAB4C0">Predict -&gt; parts -&gt; maintenance (A,B,C)</text><text x="550.0" y="455" font-size="13" text-anchor="middle" fill="#8592A3">Same IM-500 machine — four levels of capability. We climb this ladder today.</text><defs><marker id="cy" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#22D3EE"/></marker><marker id="gn" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#34D399"/></marker><marker id="am" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F59E0B"/></marker><marker id="pu" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#A78BFA"/></marker><marker id="tl" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2DD4BF"/></marker><marker id="rd" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F87171"/></marker><marker id="mu" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8592A3"/></marker></defs></svg>