<svg viewBox="0 0 1100 430" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="1100" height="430" fill="#ffffff"/><text x="550.0" y="44" font-size="26" text-anchor="middle" fill="#1f2d3d" font-weight="700">Three Ways Agents Work Together</text><text x="550.0" y="72" font-size="15" text-anchor="middle" fill="#6b7280">We use Sequential — simplest and most reliable</text><rect x="40" y="110" width="320" height="270" rx="12" fill="#f2f9f2" stroke="#1e6b1e" stroke-width="2"/><text x="200" y="140" font-size="15" text-anchor="middle" fill="#1e6b1e" font-weight="700">SEQUENTIAL</text><text x="200" y="162" font-size="11" text-anchor="middle" fill="#6b7280">what we use — simplest, reliable</text><circle cx="120" cy="220" r="26" fill="#ffffff" stroke="#1e6b1e" stroke-width="2"/><text x="120" y="225" font-size="14" text-anchor="middle" fill="#1e6b1e" font-weight="700">A</text><circle cx="120" cy="275" r="26" fill="#ffffff" stroke="#1e6b1e" stroke-width="2"/><text x="120" y="280" font-size="14" text-anchor="middle" fill="#1e6b1e" font-weight="700">B</text><circle cx="120" cy="330" r="26" fill="#ffffff" stroke="#1e6b1e" stroke-width="2"/><text x="120" y="335" font-size="14" text-anchor="middle" fill="#1e6b1e" font-weight="700">C</text><line x1="120" y1="246" x2="120" y2="268" stroke="#1e6b1e" stroke-width="2.2" marker-end="url(#ar)"/><line x1="120" y1="301" x2="120" y2="323" stroke="#1e6b1e" stroke-width="2.2" marker-end="url(#ar)"/><text x="230" y="230" font-size="11" text-anchor="start" fill="#6b7280">predict</text><text x="230" y="285" font-size="11" text-anchor="start" fill="#6b7280">check parts</text><text x="230" y="340" font-size="11" text-anchor="start" fill="#6b7280">maintenance</text><rect x="400" y="110" width="300" height="270" rx="12" fill="#eef3fb" stroke="#1f4e79" stroke-width="2"/><text x="550" y="140" font-size="15" text-anchor="middle" fill="#1f4e79" font-weight="700">SUPERVISOR</text><text x="550" y="162" font-size="11" text-anchor="middle" fill="#6b7280">one boss delegates</text><circle cx="550" cy="205" r="26" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/><text x="550" y="210" font-size="14" text-anchor="middle" fill="#1f4e79" font-weight="700">S</text><circle cx="490" cy="320" r="26" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/><text x="490" y="325" font-size="14" text-anchor="middle" fill="#1f4e79" font-weight="700">A</text><circle cx="610" cy="320" r="26" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/><text x="610" y="325" font-size="14" text-anchor="middle" fill="#1f4e79" font-weight="700">B</text><line x1="535" y1="228" x2="495" y2="296" stroke="#1f4e79" stroke-width="2.2" marker-end="url(#arb)"/><line x1="565" y1="228" x2="605" y2="296" stroke="#1f4e79" stroke-width="2.2" marker-end="url(#arb)"/><rect x="740" y="110" width="320" height="270" rx="12" fill="#f1eefb" stroke="#5b4b9a" stroke-width="2"/><text x="900" y="140" font-size="15" text-anchor="middle" fill="#5b4b9a" font-weight="700">PARALLEL</text><text x="900" y="162" font-size="11" text-anchor="middle" fill="#6b7280">run at the same time, then merge</text><circle cx="820" cy="215" r="26" fill="#ffffff" stroke="#5b4b9a" stroke-width="2"/><text x="820" y="220" font-size="14" text-anchor="middle" fill="#5b4b9a" font-weight="700">A</text><circle cx="820" cy="300" r="26" fill="#ffffff" stroke="#5b4b9a" stroke-width="2"/><text x="820" y="305" font-size="14" text-anchor="middle" fill="#5b4b9a" font-weight="700">B</text><circle cx="980" cy="258" r="26" fill="#ffffff" stroke="#5b4b9a" stroke-width="2"/><text x="980" y="263" font-size="14" text-anchor="middle" fill="#5b4b9a" font-weight="700">M</text><line x1="848" y1="220" x2="952" y2="250" stroke="#5b4b9a" stroke-width="2.2" marker-end="url(#arp)"/><line x1="848" y1="296" x2="952" y2="268" stroke="#5b4b9a" stroke-width="2.2" marker-end="url(#arp)"/><text x="550.0" y="410" font-size="13" text-anchor="middle" fill="#6b7280">All three are valid. For a clear, reliable live demo we build Sequential.</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1e6b1e"/></marker><marker id="arb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1f4e79"/></marker><marker id="aro" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d99a00"/></marker><marker id="arg" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9aa7b5"/></marker><marker id="arp" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b4b9a"/></marker></defs></svg>