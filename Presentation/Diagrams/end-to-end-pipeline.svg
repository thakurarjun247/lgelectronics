<svg viewBox="0 0 1100 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="1100" height="400" fill="#ffffff"/><text x="550.0" y="44" font-size="26" text-anchor="middle" fill="#1f2d3d" font-weight="700">The Full Picture — Question to Logged Decision</text><text x="550.0" y="72" font-size="15" text-anchor="middle" fill="#6b7280">IM-500 predictive maintenance, end to end</text><rect x="25" y="150" width="180" height="95" rx="12" fill="#eef3fb" stroke="#1f4e79" stroke-width="2"/><text x="115.0" y="182" font-size="15" text-anchor="middle" fill="#1f4e79" font-weight="700">Your question</text><text x="115.0" y="206" font-size="12" text-anchor="middle" fill="#1f2d3d">chat box</text><text x="115.0" y="271" font-size="12" text-anchor="middle" fill="#6b7280">"Servo error 140"</text><rect x="238" y="150" width="180" height="95" rx="12" fill="#f2f9f2" stroke="#1e6b1e" stroke-width="2"/><text x="328.0" y="182" font-size="15" text-anchor="middle" fill="#1e6b1e" font-weight="700">Agent A</text><text x="328.0" y="206" font-size="12" text-anchor="middle" fill="#1f2d3d">predict failure</text><text x="328.0" y="271" font-size="12" text-anchor="middle" fill="#6b7280">EN-77, ~6 days</text><rect x="451" y="150" width="180" height="95" rx="12" fill="#f1eefb" stroke="#5b4b9a" stroke-width="2"/><text x="541.0" y="182" font-size="15" text-anchor="middle" fill="#5b4b9a" font-weight="700">Agent B</text><text x="541.0" y="206" font-size="12" text-anchor="middle" fill="#1f2d3d">check spare part</text><text x="541.0" y="271" font-size="12" text-anchor="middle" fill="#6b7280">0 stock, 21-day lead</text><rect x="664" y="150" width="180" height="95" rx="12" fill="#fff7e6" stroke="#d99a00" stroke-width="2"/><text x="754.0" y="182" font-size="15" text-anchor="middle" fill="#d99a00" font-weight="700">Agent C</text><text x="754.0" y="206" font-size="12" text-anchor="middle" fill="#1f2d3d">raise maintenance</text><text x="754.0" y="271" font-size="12" text-anchor="middle" fill="#6b7280">URGENT, escalate</text><rect x="877" y="150" width="180" height="95" rx="12" fill="#eef3fb" stroke="#1f2d3d" stroke-width="2"/><text x="967.0" y="182" font-size="15" text-anchor="middle" fill="#1f2d3d" font-weight="700">Google Sheet</text><text x="967.0" y="206" font-size="12" text-anchor="middle" fill="#1f2d3d">logged row</text><text x="967.0" y="271" font-size="12" text-anchor="middle" fill="#6b7280">one record saved</text><line x1="210" y1="197.5" x2="233" y2="197.5" stroke="#1e6b1e" stroke-width="2.2" marker-end="url(#ar)"/><line x1="423" y1="197.5" x2="446" y2="197.5" stroke="#1e6b1e" stroke-width="2.2" marker-end="url(#ar)"/><line x1="636" y1="197.5" x2="659" y2="197.5" stroke="#1e6b1e" stroke-width="2.2" marker-end="url(#ar)"/><line x1="849" y1="197.5" x2="872" y2="197.5" stroke="#1e6b1e" stroke-width="2.2" marker-end="url(#ar)"/><text x="550.0" y="330" font-size="13" text-anchor="middle" fill="#6b7280">IM-500 predictive maintenance, end to end — the agent doesn't just answer, it records.</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1e6b1e"/></marker><marker id="arb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1f4e79"/></marker><marker id="aro" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d99a00"/></marker><marker id="arg" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9aa7b5"/></marker><marker id="arp" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b4b9a"/></marker></defs></svg>