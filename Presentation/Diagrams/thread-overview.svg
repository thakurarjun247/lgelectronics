<svg viewBox="0 0 1100 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="1100" height="360" fill="#ffffff"/><text x="550.0" y="44" font-size="26" text-anchor="middle" fill="#1f2d3d" font-weight="700">One Example, Grown All Day</text><text x="550.0" y="72" font-size="15" text-anchor="middle" fill="#6b7280">IM-500 predictive maintenance — the same story, deeper each stage</text><rect x="40" y="150" width="225" height="120" rx="12" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="152.5" y="176" font-size="12" text-anchor="middle" fill="#1f4e79" font-weight="700">STAGE 1 — RAG</text><text x="152.5" y="208" font-size="15" text-anchor="middle" fill="#1f2d3d">AI reads the</text><text x="152.5" y="230" font-size="15" text-anchor="middle" fill="#1f2d3d">IM-500 manuals</text><rect x="97.5" y="242" width="110" height="22" rx="6" fill="#f7f9fc" stroke="#c3d4ee" stroke-width="1"/><text x="152.5" y="257" font-size="11" text-anchor="middle" fill="#6b7280">NotebookLM</text><rect x="285" y="150" width="225" height="120" rx="12" fill="#ffffff" stroke="#1e6b1e" stroke-width="1.5"/><text x="397.5" y="176" font-size="12" text-anchor="middle" fill="#1e6b1e" font-weight="700">STAGE 2 — ONE AGENT</text><text x="397.5" y="208" font-size="15" text-anchor="middle" fill="#1f2d3d">Agent A predicts</text><text x="397.5" y="230" font-size="15" text-anchor="middle" fill="#1f2d3d">the failure</text><rect x="342.5" y="242" width="110" height="22" rx="6" fill="#f7f9fc" stroke="#c6e3c6" stroke-width="1"/><text x="397.5" y="257" font-size="11" text-anchor="middle" fill="#6b7280">n8n</text><rect x="530" y="150" width="225" height="120" rx="12" fill="#ffffff" stroke="#5b4b9a" stroke-width="1.5"/><text x="642.5" y="176" font-size="12" text-anchor="middle" fill="#5b4b9a" font-weight="700">STAGE 3 — AGENT TEAM</text><text x="642.5" y="208" font-size="15" text-anchor="middle" fill="#1f2d3d">A -&gt; B -&gt; C</text><text x="642.5" y="230" font-size="15" text-anchor="middle" fill="#1f2d3d">work together</text><rect x="587.5" y="242" width="110" height="22" rx="6" fill="#f7f9fc" stroke="#d5ccef" stroke-width="1"/><text x="642.5" y="257" font-size="11" text-anchor="middle" fill="#6b7280">n8n</text><rect x="775" y="150" width="225" height="120" rx="12" fill="#ffffff" stroke="#d99a00" stroke-width="1.5"/><text x="887.5" y="176" font-size="12" text-anchor="middle" fill="#d99a00" font-weight="700">STAGE 4 — ACTION</text><text x="887.5" y="208" font-size="15" text-anchor="middle" fill="#1f2d3d">Logs the decision</text><text x="887.5" y="230" font-size="15" text-anchor="middle" fill="#1f2d3d">to a Google Sheet</text><rect x="832.5" y="242" width="110" height="22" rx="6" fill="#f7f9fc" stroke="#d99a00" stroke-width="1"/><text x="887.5" y="257" font-size="11" text-anchor="middle" fill="#6b7280">Google Sheets</text><line x1="271" y1="210.0" x2="279" y2="210.0" stroke="#1e6b1e" stroke-width="2.2" marker-end="url(#ar)"/><line x1="516" y1="210.0" x2="524" y2="210.0" stroke="#1e6b1e" stroke-width="2.2" marker-end="url(#ar)"/><line x1="761" y1="210.0" x2="769" y2="210.0" stroke="#1e6b1e" stroke-width="2.2" marker-end="url(#ar)"/><text x="550.0" y="300" font-size="14" text-anchor="middle" fill="#6b7280">Same IM-500 example — it just gets deeper at every stage.</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1e6b1e"/></marker><marker id="arb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1f4e79"/></marker><marker id="aro" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d99a00"/></marker><marker id="arg" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9aa7b5"/></marker><marker id="arp" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b4b9a"/></marker></defs></svg>