<svg viewBox="0 0 1100 430" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="1100" height="430" fill="#0B0F15"/><text x="550.0" y="44" font-size="26" text-anchor="middle" fill="#E6EDF3" font-weight="700">Three Ways Agents Work Together</text><text x="550.0" y="72" font-size="15" text-anchor="middle" fill="#8592A3">We use Sequential — simplest and most reliable</text><rect x="40" y="110" width="320" height="270" rx="12" fill="#0E141C" stroke="#34D399" stroke-width="1.8"/><text x="200" y="140" font-size="15" text-anchor="middle" fill="#34D399" font-weight="700">SEQUENTIAL</text><text x="200" y="162" font-size="11" text-anchor="middle" fill="#AAB4C0">what we use — simplest, reliable</text><circle cx="120" cy="220" r="26" fill="#11161E" stroke="#34D399" stroke-width="2"/><text x="120" y="225" font-size="14" text-anchor="middle" fill="#34D399" font-weight="700">A</text><circle cx="120" cy="275" r="26" fill="#11161E" stroke="#34D399" stroke-width="2"/><text x="120" y="280" font-size="14" text-anchor="middle" fill="#34D399" font-weight="700">B</text><circle cx="120" cy="330" r="26" fill="#11161E" stroke="#34D399" stroke-width="2"/><text x="120" y="335" font-size="14" text-anchor="middle" fill="#34D399" font-weight="700">C</text><line x1="120" y1="246" x2="120" y2="268" stroke="#34D399" stroke-width="2.2" marker-end="url(#gn)"/><line x1="120" y1="301" x2="120" y2="323" stroke="#34D399" stroke-width="2.2" marker-end="url(#gn)"/><text x="230" y="230" font-size="11" text-anchor="start" fill="#AAB4C0">predict</text><text x="230" y="285" font-size="11" text-anchor="start" fill="#AAB4C0">check parts</text><text x="230" y="340" font-size="11" text-anchor="start" fill="#AAB4C0">maintenance</text><rect x="400" y="110" width="300" height="270" rx="12" fill="#0E141C" stroke="#22D3EE" stroke-width="1.8"/><text x="550" y="140" font-size="15" text-anchor="middle" fill="#22D3EE" font-weight="700">SUPERVISOR</text><text x="550" y="162" font-size="11" text-anchor="middle" fill="#AAB4C0">one boss delegates</text><circle cx="550" cy="205" r="26" fill="#11161E" stroke="#22D3EE" stroke-width="2"/><text x="550" y="210" font-size="14" text-anchor="middle" fill="#22D3EE" font-weight="700">S</text><circle cx="490" cy="320" r="26" fill="#11161E" stroke="#22D3EE" stroke-width="2"/><text x="490" y="325" font-size="14" text-anchor="middle" fill="#22D3EE" font-weight="700">A</text><circle cx="610" cy="320" r="26" fill="#11161E" stroke="#22D3EE" stroke-width="2"/><text x="610" y="325" font-size="14" text-anchor="middle" fill="#22D3EE" font-weight="700">B</text><line x1="535" y1="228" x2="495" y2="296" stroke="#22D3EE" stroke-width="2.2" marker-end="url(#cy)"/><line x1="565" y1="228" x2="605" y2="296" stroke="#22D3EE" stroke-width="2.2" marker-end="url(#cy)"/><rect x="740" y="110" width="320" height="270" rx="12" fill="#0E141C" stroke="#A78BFA" stroke-width="1.8"/><text x="900" y="140" font-size="15" text-anchor="middle" fill="#A78BFA" font-weight="700">PARALLEL</text><text x="900" y="162" font-size="11" text-anchor="middle" fill="#AAB4C0">run at the same time, then merge</text><circle cx="820" cy="215" r="26" fill="#11161E" stroke="#A78BFA" stroke-width="2"/><text x="820" y="220" font-size="14" text-anchor="middle" fill="#A78BFA" font-weight="700">A</text><circle cx="820" cy="300" r="26" fill="#11161E" stroke="#A78BFA" stroke-width="2"/><text x="820" y="305" font-size="14" text-anchor="middle" fill="#A78BFA" font-weight="700">B</text><circle cx="980" cy="258" r="26" fill="#11161E" stroke="#A78BFA" stroke-width="2"/><text x="980" y="263" font-size="14" text-anchor="middle" fill="#A78BFA" font-weight="700">M</text><line x1="848" y1="220" x2="952" y2="250" stroke="#A78BFA" stroke-width="2.2" marker-end="url(#pu)"/><line x1="848" y1="296" x2="952" y2="268" stroke="#A78BFA" stroke-width="2.2" marker-end="url(#pu)"/><text x="550.0" y="410" font-size="13" text-anchor="middle" fill="#8592A3">All three are valid. For a clear, reliable live demo we build Sequential.</text><defs><marker id="cy" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#22D3EE"/></marker><marker id="gn" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#34D399"/></marker><marker id="am" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F59E0B"/></marker><marker id="pu" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#A78BFA"/></marker><marker id="tl" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2DD4BF"/></marker><marker id="rd" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F87171"/></marker><marker id="mu" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8592A3"/></marker></defs></svg>