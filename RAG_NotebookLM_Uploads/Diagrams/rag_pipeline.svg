<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="42" font-size="26" font-weight="700" text-anchor="middle" fill="#1f2d3d">How RAG Works — Retrieval Augmented Generation</text>
  <text x="550" y="70" font-size="15" text-anchor="middle" fill="#6b7280">Example: IM-500 predictive maintenance — sensor and spare-part lookup in NotebookLM</text>
  <rect x="30" y="100" width="500" height="200" rx="12" fill="#eef3fb" stroke="#c3d4ee"/>
  <text x="50" y="128" font-size="15" font-weight="700" fill="#1f4e79">A. Prepare your documents (one time)</text>
  <rect x="50" y="145" width="120" height="60" rx="8" fill="#ffffff" stroke="#1f4e79"/>
  <text x="110" y="170" font-size="12" text-anchor="middle" fill="#1f2d3d">Health Manual</text>
  <text x="110" y="188" font-size="12" text-anchor="middle" fill="#1f2d3d">Spare Parts + Addendum</text>
  <rect x="205" y="145" width="120" height="60" rx="8" fill="#ffffff" stroke="#1f4e79"/>
  <text x="265" y="170" font-size="12" text-anchor="middle" fill="#1f2d3d">Chunking</text>
  <text x="265" y="188" font-size="11" text-anchor="middle" fill="#6b7280">split into pieces</text>
  <rect x="360" y="145" width="150" height="60" rx="8" fill="#ffffff" stroke="#1f4e79"/>
  <text x="435" y="170" font-size="12" text-anchor="middle" fill="#1f2d3d">Embeddings +</text>
  <text x="435" y="188" font-size="12" text-anchor="middle" fill="#1f2d3d">Vector Index</text>
  <line x1="170" y1="175" x2="203" y2="175" stroke="#1f4e79" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="325" y1="175" x2="358" y2="175" stroke="#1f4e79" stroke-width="2" marker-end="url(#ar)"/>
  <text x="280" y="250" font-size="12" text-anchor="middle" fill="#6b7280">NotebookLM does all of this automatically when you upload files</text>
  <rect x="30" y="330" width="1040" height="200" rx="12" fill="#f2f9f2" stroke="#c6e3c6"/>
  <text x="50" y="358" font-size="15" font-weight="700" fill="#1e6b1e">B. Every time you ask a question</text>
  <rect x="50" y="378" width="140" height="60" rx="8" fill="#ffffff" stroke="#1e6b1e"/>
  <text x="120" y="404" font-size="12" text-anchor="middle" fill="#1f2d3d">Your question</text>
  <text x="120" y="422" font-size="11" text-anchor="middle" fill="#6b7280">"Servo error EN-77?"</text>
  <rect x="225" y="378" width="150" height="60" rx="8" fill="#ffffff" stroke="#1e6b1e"/>
  <text x="300" y="404" font-size="12" text-anchor="middle" fill="#1f2d3d">Retrieve</text>
  <text x="300" y="422" font-size="11" text-anchor="middle" fill="#6b7280">find matching chunks</text>
  <rect x="410" y="378" width="180" height="60" rx="8" fill="#ffffff" stroke="#1e6b1e"/>
  <text x="500" y="398" font-size="12" text-anchor="middle" fill="#1f2d3d">Question + retrieved</text>
  <text x="500" y="415" font-size="12" text-anchor="middle" fill="#1f2d3d">text sent to</text>
  <text x="500" y="431" font-size="12" text-anchor="middle" fill="#6b7280">Gemini (LLM)</text>
  <rect x="625" y="378" width="160" height="60" rx="8" fill="#ffffff" stroke="#1e6b1e"/>
  <text x="705" y="404" font-size="12" text-anchor="middle" fill="#1f2d3d">Grounded answer</text>
  <text x="705" y="422" font-size="11" text-anchor="middle" fill="#6b7280">with citations</text>
  <rect x="820" y="378" width="220" height="60" rx="8" fill="#fff7e6" stroke="#d99a00"/>
  <text x="930" y="398" font-size="12" text-anchor="middle" fill="#1f2d3d">If not in docs:</text>
  <text x="930" y="416" font-size="12" text-anchor="middle" fill="#1f2d3d">"No info in sources"</text>
  <text x="930" y="432" font-size="11" text-anchor="middle" fill="#6b7280">no hallucination</text>
  <line x1="190" y1="408" x2="223" y2="408" stroke="#1e6b1e" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="375" y1="408" x2="408" y2="408" stroke="#1e6b1e" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="590" y1="408" x2="623" y2="408" stroke="#1e6b1e" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="785" y1="408" x2="818" y2="408" stroke="#d99a00" stroke-width="2" marker-end="url(#aro)"/>
  <line x1="435" y1="205" x2="435" y2="300" stroke="#9aa7b5" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="435" y1="300" x2="300" y2="300" stroke="#9aa7b5" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="300" y1="300" x2="300" y2="376" stroke="#9aa7b5" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arg)"/>
  <text x="470" y="322" font-size="11" fill="#9aa7b5">index is searched at question time</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1f4e79"/></marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9aa7b5"/></marker>
    <marker id="aro" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d99a00"/></marker>
  </defs>
</svg>
