<svg viewBox="0 0 1100 430" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="1100" height="430" fill="#0B0F15"/><text x="550.0" y="44" font-size="26" text-anchor="middle" fill="#E6EDF3" font-weight="700">What Makes It an Agent</text><text x="550.0" y="72" font-size="15" text-anchor="middle" fill="#8592A3">Agent A on the IM-500 — LLM + your data + a decision</text><rect x="40" y="180" width="190" height="80" rx="10" fill="#11161E" stroke="#22D3EE" stroke-width="1.6"/><text x="135" y="208" font-size="13" text-anchor="middle" fill="#E6EDF3" font-weight="700">Question</text><text x="135" y="232" font-size="12" text-anchor="middle" fill="#AAB4C0">"vibration 3.9</text><text x="135" y="249" font-size="12" text-anchor="middle" fill="#AAB4C0">mm/s, 4 shifts"</text><rect x="330" y="140" width="420" height="160" rx="14" fill="#0E141C" stroke="#22D3EE" stroke-width="2.2"/><text x="540.0" y="170" font-size="15" text-anchor="middle" fill="#E6EDF3" font-weight="700">AI AGENT  (Agent A)</text><rect x="360" y="190" width="170" height="80" rx="8" fill="#11161E" stroke="#34D399" stroke-width="1.4"/><text x="445" y="218" font-size="13" text-anchor="middle" fill="#E6EDF3" font-weight="700">Gemini (LLM)</text><text x="445" y="240" font-size="11" text-anchor="middle" fill="#AAB4C0">the brain</text><rect x="550" y="190" width="170" height="80" rx="8" fill="#11161E" stroke="#22D3EE" stroke-width="1.4"/><text x="635" y="212" font-size="13" text-anchor="middle" fill="#E6EDF3" font-weight="700">IM-500 data</text><text x="635" y="232" font-size="11" text-anchor="middle" fill="#AAB4C0">thresholds in the</text><text x="635" y="248" font-size="11" text-anchor="middle" fill="#AAB4C0">system prompt</text><rect x="830" y="165" width="230" height="110" rx="10" fill="#11161E" stroke="#F59E0B" stroke-width="1.6"/><text x="945" y="192" font-size="12" text-anchor="middle" fill="#F59E0B" font-weight="700">DECISION</text><text x="945" y="216" font-size="13" text-anchor="middle" fill="#E6EDF3">Pump bearing wear</text><text x="945" y="236" font-size="13" text-anchor="middle" fill="#E6EDF3">~7 days</text><text x="945" y="258" font-size="12" text-anchor="middle" fill="#AAB4C0">schedule maintenance</text><line x1="232" y1="220" x2="324" y2="220.0" stroke="#22D3EE" stroke-width="2.2" marker-end="url(#cy)"/><line x1="756" y1="220.0" x2="828" y2="220" stroke="#F59E0B" stroke-width="2.2" marker-end="url(#am)"/><text x="550.0" y="360" font-size="13" text-anchor="middle" fill="#8592A3">Not just a chatbot: a brain (LLM) + your data + a decision.  (Add a Tool and it can also act.)</text><defs><marker id="cy" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#22D3EE"/></marker><marker id="gn" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#34D399"/></marker><marker id="am" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F59E0B"/></marker><marker id="pu" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#A78BFA"/></marker><marker id="tl" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2DD4BF"/></marker><marker id="rd" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F87171"/></marker><marker id="mu" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8592A3"/></marker></defs></svg>