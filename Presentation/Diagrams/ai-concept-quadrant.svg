<svg viewBox="0 0 1100 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="1100" height="470" fill="#ffffff"/><text x="550.0" y="44" font-size="26" text-anchor="middle" fill="#1f2d3d" font-weight="700">AI vs GenAI vs AI Agent vs Agentic AI</text><text x="550.0" y="72" font-size="15" text-anchor="middle" fill="#6b7280">Explained on the one machine we use all day — the IM-500</text><rect x="45" y="105" width="500" height="150" rx="12" fill="#eef3fb" stroke="#1f4e79" stroke-width="2"/><text x="69" y="143" font-size="20" text-anchor="start" fill="#1f4e79" font-weight="700">AI</text><text x="69" y="177" font-size="14" text-anchor="start" fill="#1f2d3d">Rules &amp; patterns</text><rect x="67" y="197" width="456" height="40" rx="8" fill="#ffffff" stroke="#c3d4ee" stroke-width="1"/><text x="295.0" y="222" font-size="13" text-anchor="middle" fill="#1f2d3d">"Flag if vibration &gt; 4.5"</text><rect x="565" y="105" width="500" height="150" rx="12" fill="#f2f9f2" stroke="#1e6b1e" stroke-width="2"/><text x="589" y="143" font-size="20" text-anchor="start" fill="#1e6b1e" font-weight="700">Generative AI</text><text x="589" y="177" font-size="14" text-anchor="start" fill="#1f2d3d">Creates language</text><rect x="587" y="197" width="456" height="40" rx="8" fill="#ffffff" stroke="#c6e3c6" stroke-width="1"/><text x="815.0" y="222" font-size="13" text-anchor="middle" fill="#1f2d3d">Writes a shift summary from notes</text><rect x="45" y="280" width="500" height="150" rx="12" fill="#f1eefb" stroke="#5b4b9a" stroke-width="2"/><text x="69" y="318" font-size="20" text-anchor="start" fill="#5b4b9a" font-weight="700">AI Agent</text><text x="69" y="352" font-size="14" text-anchor="start" fill="#1f2d3d">LLM + your data + a decision</text><rect x="67" y="372" width="456" height="40" rx="8" fill="#ffffff" stroke="#d5ccef" stroke-width="1"/><text x="295.0" y="397" font-size="13" text-anchor="middle" fill="#1f2d3d">"Servo error -&gt; EN-77 failing, ~6d"  (Agent A)</text><rect x="565" y="280" width="500" height="150" rx="12" fill="#fff7e6" stroke="#d99a00" stroke-width="2"/><text x="589" y="318" font-size="20" text-anchor="start" fill="#d99a00" font-weight="700">Agentic AI</text><text x="589" y="352" font-size="14" text-anchor="start" fill="#1f2d3d">A team of agents coordinating</text><rect x="587" y="372" width="456" height="40" rx="8" fill="#ffffff" stroke="#d99a00" stroke-width="1"/><text x="815.0" y="397" font-size="13" text-anchor="middle" fill="#1f2d3d">Predict -&gt; parts -&gt; maintenance (A,B,C)</text><text x="550.0" y="455" font-size="13" text-anchor="middle" fill="#6b7280">Same IM-500 machine — four levels of capability. We climb this ladder today.</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1e6b1e"/></marker><marker id="arb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1f4e79"/></marker><marker id="aro" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d99a00"/></marker><marker id="arg" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9aa7b5"/></marker><marker id="arp" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b4b9a"/></marker></defs></svg>