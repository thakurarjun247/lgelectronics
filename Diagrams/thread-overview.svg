<svg viewBox="0 0 1100 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="1100" height="360" fill="#0B0F15"/><text x="550.0" y="44" font-size="26" text-anchor="middle" fill="#E6EDF3" font-weight="700">One Example, Grown All Day</text><text x="550.0" y="72" font-size="15" text-anchor="middle" fill="#8592A3">IM-500 predictive maintenance — the same story, deeper each stage</text><rect x="40" y="150" width="225" height="120" rx="12" fill="#11161E" stroke="#22D3EE" stroke-width="1.8"/><text x="152.5" y="176" font-size="12" text-anchor="middle" fill="#22D3EE" font-weight="700">STAGE 1 — RAG</text><text x="152.5" y="208" font-size="15" text-anchor="middle" fill="#E6EDF3">AI reads the</text><text x="152.5" y="230" font-size="15" text-anchor="middle" fill="#E6EDF3">IM-500 manuals</text><rect x="97.5" y="242" width="110" height="22" rx="6" fill="#0E141C" stroke="#1F2937" stroke-width="1"/><text x="152.5" y="257" font-size="11" text-anchor="middle" fill="#AAB4C0">NotebookLM</text><rect x="285" y="150" width="225" height="120" rx="12" fill="#11161E" stroke="#34D399" stroke-width="1.8"/><text x="397.5" y="176" font-size="12" text-anchor="middle" fill="#34D399" font-weight="700">STAGE 2 — ONE AGENT</text><text x="397.5" y="208" font-size="15" text-anchor="middle" fill="#E6EDF3">Agent A predicts</text><text x="397.5" y="230" font-size="15" text-anchor="middle" fill="#E6EDF3">the failure</text><rect x="342.5" y="242" width="110" height="22" rx="6" fill="#0E141C" stroke="#1F2937" stroke-width="1"/><text x="397.5" y="257" font-size="11" text-anchor="middle" fill="#AAB4C0">n8n</text><rect x="530" y="150" width="225" height="120" rx="12" fill="#11161E" stroke="#A78BFA" stroke-width="1.8"/><text x="642.5" y="176" font-size="12" text-anchor="middle" fill="#A78BFA" font-weight="700">STAGE 3 — AGENT TEAM</text><text x="642.5" y="208" font-size="15" text-anchor="middle" fill="#E6EDF3">A -&gt; B -&gt; C</text><text x="642.5" y="230" font-size="15" text-anchor="middle" fill="#E6EDF3">work together</text><rect x="587.5" y="242" width="110" height="22" rx="6" fill="#0E141C" stroke="#1F2937" stroke-width="1"/><text x="642.5" y="257" font-size="11" text-anchor="middle" fill="#AAB4C0">n8n</text><rect x="775" y="150" width="225" height="120" rx="12" fill="#11161E" stroke="#F59E0B" stroke-width="1.8"/><text x="887.5" y="176" font-size="12" text-anchor="middle" fill="#F59E0B" font-weight="700">STAGE 4 — ACTION</text><text x="887.5" y="208" font-size="15" text-anchor="middle" fill="#E6EDF3">Logs the decision</text><text x="887.5" y="230" font-size="15" text-anchor="middle" fill="#E6EDF3">to a Google Sheet</text><rect x="832.5" y="242" width="110" height="22" rx="6" fill="#0E141C" stroke="#1F2937" stroke-width="1"/><text x="887.5" y="257" font-size="11" text-anchor="middle" fill="#AAB4C0">Google Sheets</text><line x1="271" y1="210.0" x2="279" y2="210.0" stroke="#34D399" stroke-width="2.2" marker-end="url(#gn)"/><line x1="516" y1="210.0" x2="524" y2="210.0" stroke="#34D399" stroke-width="2.2" marker-end="url(#gn)"/><line x1="761" y1="210.0" x2="769" y2="210.0" stroke="#34D399" stroke-width="2.2" marker-end="url(#gn)"/><text x="550.0" y="300" font-size="14" text-anchor="middle" fill="#8592A3">Same IM-500 example — it just gets deeper at every stage.</text><defs><marker id="cy" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#22D3EE"/></marker><marker id="gn" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#34D399"/></marker><marker id="am" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F59E0B"/></marker><marker id="pu" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#A78BFA"/></marker><marker id="tl" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2DD4BF"/></marker><marker id="rd" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F87171"/></marker><marker id="mu" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8592A3"/></marker></defs></svg>