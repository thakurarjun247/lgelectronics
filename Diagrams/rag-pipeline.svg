<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="1100" height="560" fill="#0B0F15"/><text x="550.0" y="44" font-size="26" text-anchor="middle" fill="#E6EDF3" font-weight="700">How RAG Works — Retrieval Augmented Generation</text><text x="550.0" y="72" font-size="15" text-anchor="middle" fill="#8592A3">Example: IM-500 predictive maintenance — sensor &amp; spare-part lookup in NotebookLM</text><rect x="30" y="100" width="500" height="200" rx="12" fill="#0E141C" stroke="#1F2937" stroke-width="1.4"/><text x="50" y="128" font-size="15" text-anchor="start" fill="#22D3EE" font-weight="700">A. Prepare your documents (one time)</text><rect x="50" y="145" width="120" height="60" rx="8" fill="#11161E" stroke="#22D3EE" stroke-width="1.4"/><text x="110" y="170" font-size="12" text-anchor="middle" fill="#E6EDF3">Health Manual</text><text x="110" y="188" font-size="11" text-anchor="middle" fill="#AAB4C0">Spare Parts + Addendum</text><rect x="205" y="145" width="120" height="60" rx="8" fill="#11161E" stroke="#22D3EE" stroke-width="1.4"/><text x="265" y="170" font-size="12" text-anchor="middle" fill="#E6EDF3">Chunking</text><text x="265" y="188" font-size="11" text-anchor="middle" fill="#AAB4C0">split into pieces</text><rect x="360" y="145" width="150" height="60" rx="8" fill="#11161E" stroke="#22D3EE" stroke-width="1.4"/><text x="435" y="170" font-size="12" text-anchor="middle" fill="#E6EDF3">Embeddings +</text><text x="435" y="188" font-size="12" text-anchor="middle" fill="#E6EDF3">Vector Index</text><line x1="172" y1="175" x2="203" y2="175" stroke="#22D3EE" stroke-width="2" marker-end="url(#cy)"/><line x1="327" y1="175" x2="358" y2="175" stroke="#22D3EE" stroke-width="2" marker-end="url(#cy)"/><text x="280" y="250" font-size="12" text-anchor="middle" fill="#8592A3">NotebookLM does all of this automatically when you upload files</text><rect x="30" y="330" width="1040" height="200" rx="12" fill="#0E141C" stroke="#1F2937" stroke-width="1.4"/><text x="50" y="358" font-size="15" text-anchor="start" fill="#34D399" font-weight="700">B. Every time you ask a question</text><rect x="50" y="378" width="140" height="60" rx="8" fill="#11161E" stroke="#34D399" stroke-width="1.4"/><text x="120" y="404" font-size="12" text-anchor="middle" fill="#E6EDF3">Your question</text><text x="120" y="422" font-size="11" text-anchor="middle" fill="#AAB4C0">"Servo error EN-77?"</text><rect x="225" y="378" width="150" height="60" rx="8" fill="#11161E" stroke="#34D399" stroke-width="1.4"/><text x="300" y="404" font-size="12" text-anchor="middle" fill="#E6EDF3">Retrieve</text><text x="300" y="422" font-size="11" text-anchor="middle" fill="#AAB4C0">find matching chunks</text><rect x="410" y="378" width="180" height="60" rx="8" fill="#11161E" stroke="#34D399" stroke-width="1.4"/><text x="500" y="398" font-size="12" text-anchor="middle" fill="#E6EDF3">Question + retrieved</text><text x="500" y="415" font-size="12" text-anchor="middle" fill="#E6EDF3">text sent to</text><text x="500" y="431" font-size="11" text-anchor="middle" fill="#AAB4C0">Gemini (LLM)</text><rect x="625" y="378" width="160" height="60" rx="8" fill="#11161E" stroke="#34D399" stroke-width="1.4"/><text x="705" y="404" font-size="12" text-anchor="middle" fill="#E6EDF3">Grounded answer</text><text x="705" y="422" font-size="11" text-anchor="middle" fill="#AAB4C0">with citations</text><rect x="820" y="378" width="220" height="60" rx="8" fill="#11161E" stroke="#F59E0B" stroke-width="1.4"/><text x="930" y="398" font-size="12" text-anchor="middle" fill="#E6EDF3">If not in docs:</text><text x="930" y="416" font-size="12" text-anchor="middle" fill="#E6EDF3">"No info in sources"</text><text x="930" y="432" font-size="11" text-anchor="middle" fill="#AAB4C0">no hallucination</text><line x1="190" y1="408" x2="223" y2="408" stroke="#34D399" stroke-width="2" marker-end="url(#gn)"/><line x1="375" y1="408" x2="408" y2="408" stroke="#34D399" stroke-width="2" marker-end="url(#gn)"/><line x1="590" y1="408" x2="623" y2="408" stroke="#34D399" stroke-width="2" marker-end="url(#gn)"/><line x1="785" y1="408" x2="818" y2="408" stroke="#F59E0B" stroke-width="2" marker-end="url(#am)"/><line x1="435" y1="205" x2="435" y2="300" stroke="#8592A3" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#mu)"/><line x1="435" y1="300" x2="300" y2="300" stroke="#8592A3" stroke-width="2" stroke-dasharray="5,4"/><line x1="300" y1="300" x2="300" y2="376" stroke="#8592A3" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#mu)"/><text x="470" y="322" font-size="11" text-anchor="start" fill="#8592A3">index is searched at question time</text><defs><marker id="cy" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#22D3EE"/></marker><marker id="gn" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#34D399"/></marker><marker id="am" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F59E0B"/></marker><marker id="pu" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#A78BFA"/></marker><marker id="tl" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2DD4BF"/></marker><marker id="rd" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F87171"/></marker><marker id="mu" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8592A3"/></marker></defs></svg>